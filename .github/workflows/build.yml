name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild -project YTDownloader.xcodeproj -scheme YTDownloader \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YTDownloader.app Payload/
          zip -r YTDownloader.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-ipa
          path: YTDownloader.ipa
